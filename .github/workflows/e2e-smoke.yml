name: Browser smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Sign-in, guest showcase and paste-URL flow (fake GitHub, headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: repolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens -d repolens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway services and a FAKE GitHub served by tests/e2e/fake_github.py: no OAuth App, no GitHub or AI credentials.
    env:
      DATABASE_URL: postgresql+asyncpg://repolens:ci_only_password@127.0.0.1:5432/repolens
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.txt
          npm ci --prefix apps/web

      - name: Cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-grammars-${{ runner.os }}-${{ hashFiles('apps/api/requirements.txt') }}

      - name: Provision tree-sitter grammars
        run: |
          python - <<'PY'
          from apps.api.services.code_parser import ensure_grammars, missing_grammars

          ensure_grammars()
          left = missing_grammars()
          if left:
              raise SystemExit(f"grammars still missing: {left}")
          PY

      - name: Run the browser smoke test
        run: python -m tests.e2e.run_smoke
