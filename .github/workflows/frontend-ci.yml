name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node 22, Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The unit tests run TypeScript directly with `node --test`, which needs Node 22.18 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint (no warnings allowed)
        run: npm run lint -- --max-warnings 0

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Production build
        run: npm run build
        env:
          # Inlined into the browser bundle, so it must be a harmless placeholder and never a secret.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8765
          NEXT_TELEMETRY_DISABLED: "1"
