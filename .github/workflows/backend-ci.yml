name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.14, PostgreSQL + pgvector, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: repolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens -d repolens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway services only. No Gemini, Groq or GitHub credentials are set anywhere in this workflow: the tests
    # replace every external call with fakes, and the AI providers stay unconfigured.
    env:
      DATABASE_URL: postgresql+asyncpg://repolens:ci_only_password@127.0.0.1:5432/repolens
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      # The parser never downloads grammars while it runs (see apps/api/services/code_parser.py), and several tests
      # expect them to be present. Fetch the four supported grammars once, and fail here rather than skip tests later.
      - name: Cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-grammars-${{ runner.os }}-${{ hashFiles('apps/api/requirements.txt') }}

      - name: Provision tree-sitter grammars
        run: |
          python - <<'PY'
          from apps.api.services.code_parser import ensure_grammars, missing_grammars

          ensure_grammars()
          left = missing_grammars()
          if left:
              raise SystemExit(f"grammars still missing: {left}")
          print("tree-sitter grammars ready")
          PY

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Check models match the migrations
        run: alembic check

      - name: Check migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q

      - name: Start the API and check its health endpoints
        run: |
          uvicorn apps.api.main:app --port 8765 > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health
          echo
          curl -sf http://127.0.0.1:8765/health/ready
          echo
          curl -sf http://127.0.0.1:8765/repositories > /dev/null
